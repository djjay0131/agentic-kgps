[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-kgps"
version = "0.3.0"
description = "Knowledge Graph Provenance Service (PA-AKG): read-side evidence chains, lineage, impact and grounded-answer provenance over KGIS/KGCS"
requires-python = ">=3.11"
# kg_contracts (Assertion, Evidence, EvidenceRef, Derivation, GraphReader) ships in
# agentic-kgis. KGPS reads those records; it never writes canonical state
# (ADR-0001). agentic-kgis is not on a package index: CI installs it from git.
dependencies = ["agentic-kgis>=0.6.0"]

[project.optional-dependencies]
# Optional surfaces (wave 2b). The core service needs none of them.
mcp = ["mcp>=1.2"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "pytest>=8.0",
    "ruff==0.16.4",
    "mypy>=1.10",
    "mcp>=1.2",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
kgps-mcp = "kgps.mcp_server:main"
kgps-http = "kgps.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kgps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kgps", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# agentic-kgis ships kg_contracts typed; the kgis package itself has no py.typed.
[[tool.mypy.overrides]]
module = ["kgis", "kgis.*"]
ignore_missing_imports = true
