[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-kgps"
version = "0.2.0"
description = "Knowledge Graph Provenance Service (PA-AKG): read-side evidence chains, lineage, impact and grounded-answer provenance over KGIS/KGCS"
requires-python = ">=3.11"
# kg_contracts (Assertion, Evidence, EvidenceRef, Derivation, GraphReader) ships in
# agentic-kgis. KGPS reads those records; it never writes canonical state
# (ADR-0001). agentic-kgis is not on a package index: CI installs it from git.
dependencies = ["agentic-kgis>=0.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/kgps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kgps", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
